name: xnu-civi

# Builds the SWEET/XNU kernel for the Xiaomi Civi (SM7325, "yupik").
#
# Differences from the topaz xnu workflow:
#   * patch set is xnu/patches-civi/ (sweet 0001-0079 + Civi 0080/0081):
#     no ARMv8.0 -mcpu=cortex-a53 workaround, no LSE/LDAPR emulator (the
#     A55/A78 are ARMv8.2 and have LSE, RCpc and PAN), no FT5452 touch, no
#     topaz display scanout patches
#   * clang gets -march=armv8.2-a instead of -mcpu=cortex-a53
#   * arm64 only (no arm64e/PAC: these cores have no PAC)
#
# Usage: Actions -> xnu-civi -> Run workflow, then download the
# "xnu-kernel-civi" artifact (kernel.development.sweet).

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [ main ]
    paths:
      - "xnu/patches-civi/**"
      - ".github/workflows/xnu-civi.yml"

concurrency:
  group: xnu-civi-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: SWEET
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check the civi patch set
        run: |
          ls xnu/patches-civi | wc -l
          ls xnu/patches-civi | tail -3
          grep -n "0x81000000" xnu/patches-civi/0081-civi-boot-cpu-mpidr.patch | head -3
          grep -c "mcpu=cortex-a53\|ldaxr\|casa" xnu/patches-civi/*.patch || true
          # civi: sweet's splash framebuffer 0x9c000000 is NOT RAM on Civi
          # (System RAM starts at 0xdff00000), so patches 0010/0012 must have
          # been rewritten to 0x0e1000000 or the phone data-aborts on the very
          # first pixel XNU draws and the boot looks like nothing happened.
          if grep -rn "0x9c000000" xnu/patches-civi/ ; then
            echo "::error::sweet's framebuffer address 0x9c000000 survived into patches-civi"
            exit 1
          fi
          echo "framebuffer address check: clean"
          grep -c "0x0e1000000" xnu/patches-civi/0010-sweet-early-framebuffer-debug.patch \
                                  xnu/patches-civi/0012-sweet-keep-debug-console-after-ttbr0.patch

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches-civi/*.patch xnu/patches-civi/*.sh dxb/patches/
          # civi: plain arm64 (no PAC) with armv8.2 features. Do NOT use
          # -mcpu=cortex-a53: that is topaz's ARMv8.0 workaround and it would
          # turn off the LSE atomics / RCpc that these A55/A78 cores have.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -march=armv8.2-a"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -march=armv8.2-a"' dxb/build.sh
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches | tail -4

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun --find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-civi-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches-civi/**', '.github/workflows/xnu-civi.yml') }}
          restore-keys: |
            ccache-civi-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-civi
          path: out/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### civi kernel" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la out 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
